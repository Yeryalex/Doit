<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Repo</title>
</head>
<body>
    <main>
        <div class="sidebar">
            <div class="profile-box">
                <div class="profile-image"></div>
                <p class="name">Yerodri</p>
                <p class="user-name">@yerodri_z</p>
            </div>
            <div class="all-mytasks-section">
                <div class="mytask-icon"></div>
                <p>All my tasks</p>
                <div class="number-tasks">0</div>
            </div>
            
            <div class="list-section">       
                <div class="list-section-title">        
                    <p>My lists</p>
                    <p class="list-icon-sidebar"></p>
                </div> 
                <button id="add-list">
                    <svg  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>                
                </button>
                
                <dialog closedby="any" id="dialog-add-list">
                    <div id="close-dialog">
                        <svg xmlns="http://www.w3.org/2000/svg" style="fill: lightgray; background-color: rgba(0, 0, 0, 0.01);" viewBox="0 0 24 24"><path d="M9,7L11,12L9,17H11L12,14.5L13,17H15L13,12L15,7H13L12,9.5L11,7H9M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z" /></svg>
                    </div>
                    <form action="#" id="modal-form" name="registerlist">
                        <input id="input-modal" type="text" name="inputlist" required placeholder="Add a list title">
                        <button type="submit" id="modal-form-button">Continue</button>
                    </form>
                </dialog>
            
            </div>

            <div class="list-names-container">
                <div class="list-counter-container">
                    <button class="sidebar-list-button">Personal</button>
                    <div></div>
                    <!-- <div class="number-tasks-list">0</div> -->
                </div>
            </div>
   

        </div>
         
        <div class="main-container">
            
            <div class="decoration-ball ball-1"></div>
            <div class="decoration-ball ball-2"></div>
            <div class="decoration-ball ball-3"></div>
            <div class="decoration-ball ball-4"></div>
            
            <div class="main-task-container"></div>
            
            <form action="#" id="task-form">

                <div role="button" tabindex="0" class="modal-showlist-icon">

                </div>
 
                <p class="title">
                      <label for="title"></label>
                    <input type="text" id="title" placeholder="Add task" maxlength="80" required>
                </p>
                <!-- <p class="description">
                    <label for="description"></label>
                    <input type="text" id="description" placeholder="Description" maxlength="80">
                </p> -->
                <button class="button-arrow">
                        <svg id="arrow-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11,20V7.75L5.75,13L5,12.34L11.5,5.84L18,12.34L17.25,13L12,7.75V20H11Z" /></svg>
                    </button>
                <!-- <div class="options-container">

                    <p class="priority">
                       <label for="priority">Priority:</label>
                        <select name="Priority" id="priority">
                            <option value="High" selected>High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>   
                    </p> 
                    <p class="dueDate">
                        <label for="dueDate"></label>
                        <input type="date" id="dueDate">
                    </p>
           
                    <button class="button-arrow">
                        <svg id="arrow-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11,20V7.75L5.75,13L5,12.34L11.5,5.84L18,12.34L17.25,13L12,7.75V20H11Z" /></svg>
                    </button> -->
                </div>
            </form>
        </div>
    </main>
    <div class="modal-container">
        <div class="mylist-container">
            <div class="mylist-section">
                <p>My lists</p>
                <p></p>
            </div>
        </div>
        <div class="modal-contain-buttons"></div>
    </div> 
</body>
</html>
