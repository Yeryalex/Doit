<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Repo</title>
</head>
<body>
    <main>
        <div class="sidebar">
            <div>
                <div>Profile</div>
                <p>Name USER</p>
                <p>@user_z</p>
            </div>

            <div>
                <p>All tasks</p>
                <p>My projects</p>
            </div>

            <button>Add new Prokect +</button>
        </div>
        <div class="main-container">
           <div class="task-container">

           </div>
           
            <form action="#" id="task-form">
                <p class="title">
                      <label for="title"></label>
                    <input type="text" id="title"  placeholder="Title">
                </p>
                <p class="description">
                    <label for="description"></label>
                    <input type="text" id="description" placeholder="Description">
                </p>
                <div class="options-container">
                    <p class="dueDate">
                        <label for="dueDate"></label>
                        <input type="date" id="dueDate">
                    </p>
                    
                    <p class="priority">
                        <label for="priority"></label>
                        <select name="Priority" id="priority">
                            <option value="">--Priority--</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>    
                    </p>    
                    <button class="button-arrow">
                        <svg id="arrow-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11,20V7.75L5.75,13L5,12.34L11.5,5.84L18,12.34L17.25,13L12,7.75V20H11Z" /></svg>
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
