<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Repo</title>
</head>
<body>
    <main>
        <div class="sidebar">
            <div class="profile-box">
                <img class="image-profile" src="icons/simon-twukN12EN7c-unsplash.jpg" alt="profile picture">
                <p>Name User</p>
                <p>@user_z</p>
            </div>
            <div>
                <p>All tasks</p>
            </div>
            <div>
                <button>My Projects +</button>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
                <p>My project 1</p>
            </div>

            
        </div>
        <div class="main-container">
            <div class="scroll-section">
                <div class="main-task-container"></div>
            </div>
           
            <form action="#" id="task-form">
                <p class="title">
                      <label for="title"></label>
                    <input type="text" id="title"  placeholder="Title">
                </p>
                <p class="description">
                    <label for="description"></label>
                    <input type="text" id="description" placeholder="Description">
                </p>
                <div class="options-container">

                    <p class="priority">
                       <label for="priority">Priority:</label>
                        <select name="Priority" id="priority">
                            <option value="High" selected>High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>   
                    </p> 
                    <p class="dueDate">
                        <label for="dueDate"></label>
                        <input type="date" id="dueDate">
                    </p>
           
                    <button class="button-arrow">
                        <svg id="arrow-up" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11,20V7.75L5.75,13L5,12.34L11.5,5.84L18,12.34L17.25,13L12,7.75V20H11Z" /></svg>
                    </button>
                </div>
            </form>
        </div>
    </main>


</body>
</html>
